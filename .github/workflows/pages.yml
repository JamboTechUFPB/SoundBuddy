name: Publish SoundBuddy demo

on:
  push:
    branches: [main, feat/soundbuddy-pages-demo]
    paths:
      - 'landing-page/**'
      - 'frontend/demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble landing page and app demo
        run: |
          mkdir -p _site/app
          cp -R landing-page/. _site/
          cp -R frontend/demo/. _site/app/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
